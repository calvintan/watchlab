<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watch Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=Exo+2:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;500;600;700&family=Orbitron:wght@400;500;700&family=Oswald:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell panel-collapsed">
      <header class="top-bar">
        <div class="brand">
          <span class="brand__icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"><path fill="#2b2b2b" d="M19.313 12a7.3 7.3 0 0 0-3.05-5.935l-.597-3.3a1.31 1.31 0 0 0-1.292-1.078H9.626a1.31 1.31 0 0 0-1.292 1.079l-.597 3.299a7.3 7.3 0 0 0 0 11.87l.597 3.3a1.31 1.31 0 0 0 1.292 1.078h4.748a1.31 1.31 0 0 0 1.292-1.079l.597-3.299A7.3 7.3 0 0 0 19.313 12M9.442 2.966a.19.19 0 0 1 .187-.154h4.748a.19.19 0 0 1 .187.154l.428 2.362a7.28 7.28 0 0 0-5.972 0zm5.116 18.068a.19.19 0 0 1-.187.154H9.626a.19.19 0 0 1-.187-.154l-.428-2.362a7.28 7.28 0 0 0 5.972 0zM12 18.188A6.187 6.187 0 1 1 18.188 12 6.195 6.195 0 0 1 12 18.188M16.313 12a.56.56 0 0 1-.563.563H12a.56.56 0 0 1-.562-.563V8.25a.563.563 0 0 1 1.124 0v3.188h3.188a.56.56 0 0 1 .563.562"/></svg>
          </span>
          <span class="brand__label">WATCH LAB</span>
        </div>

        <button
          class="customise-button"
          id="customise-button"
          type="button"
          aria-expanded="false"
          aria-controls="control-panel"
        >
          <span class="customise-button__icon" aria-hidden="true">
            <svg
              class="customise-button__icon-image"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M3.74981 8.063H6.99381C7.12364 8.6981 7.46885 9.26888 7.97103 9.67879C8.47322 10.0887 9.10157 10.3126 9.74981 10.3126C10.398 10.3126 11.0264 10.0887 11.5286 9.67879C12.0308 9.26888 12.376 8.6981 12.5058 8.063H20.2498C20.3991 8.063 20.5423 8.00368 20.6479 7.8981C20.7535 7.79252 20.8128 7.64931 20.8128 7.5C20.8128 7.35068 20.7535 7.20748 20.6479 7.1019C20.5423 6.99631 20.3991 6.937 20.2498 6.937H12.5058C12.377 6.30106 12.0322 5.72926 11.5299 5.31852C11.0276 4.90779 10.3987 4.6834 9.74981 4.6834C9.10095 4.6834 8.47206 4.90779 7.96976 5.31852C7.46746 5.72926 7.12266 6.30106 6.99381 6.937H3.74981C3.67394 6.9338 3.59822 6.94598 3.52718 6.9728C3.45615 6.99963 3.39127 7.04055 3.33646 7.0931C3.28165 7.14564 3.23804 7.20874 3.20824 7.27858C3.17845 7.34842 3.16309 7.42357 3.16309 7.4995C3.16309 7.57543 3.17845 7.65058 3.20824 7.72042C3.23804 7.79026 3.28165 7.85335 3.33646 7.9059C3.39127 7.95845 3.45615 7.99937 3.52718 8.02619C3.59822 8.05302 3.67394 8.0662 3.74981 8.063ZM9.74981 5.812C10.1972 5.812 10.6263 5.98973 10.9427 6.30611C11.2591 6.62248 11.4368 7.05158 11.4368 7.499C11.4368 7.94642 11.2591 8.37551 10.9427 8.69189C10.6263 9.00826 10.1972 9.186 9.74981 9.186C9.30239 9.186 8.87329 9.00826 8.55692 8.69189C8.24055 8.37551 8.06281 7.94642 8.06281 7.499C8.06281 7.05158 8.24055 6.62248 8.55692 6.30611C8.87329 5.98973 9.30239 5.812 9.74981 5.812ZM20.2498 15.937H18.5058C18.376 15.3019 18.0308 14.7311 17.5286 14.3212C17.0264 13.9113 16.398 13.6874 15.7498 13.6874C15.1016 13.6874 14.4732 13.9113 13.971 14.3212C13.4688 14.7311 13.1236 15.3019 12.9938 15.937H3.74981C3.60655 15.9455 3.47197 16.0085 3.37356 16.1129C3.27515 16.2174 3.22035 16.3555 3.22035 16.499C3.22035 16.6425 3.27515 16.7806 3.37356 16.8851C3.47197 16.9895 3.60655 17.0524 3.74981 17.061H12.9938C13.1236 17.6961 13.4688 18.2669 13.971 18.6768C14.4732 19.0867 15.1016 19.3106 15.7498 19.3106C16.398 19.3106 17.0264 19.0867 17.5286 18.6768C18.0308 18.2669 18.376 17.6961 18.5058 17.061H20.2498C20.399 17.061 20.5421 17.0017 20.6476 16.8962C20.753 16.7908 20.8123 16.6477 20.8123 16.4985C20.8123 16.3493 20.753 16.2062 20.6476 16.1007C20.5421 15.9953 20.399 15.936 20.2498 15.936M15.7498 18.186C15.5282 18.186 15.3088 18.1423 15.104 18.0575C14.8993 17.9727 14.7133 17.8484 14.5566 17.6917C14.3999 17.535 14.2756 17.349 14.1908 17.1443C14.106 16.9395 14.0623 16.7201 14.0623 16.4985C14.0623 16.2769 14.106 16.0575 14.1908 15.8527C14.2756 15.648 14.3999 15.462 14.5566 15.3053C14.7133 15.1486 14.8993 15.0243 15.104 14.9395C15.3088 14.8546 15.5282 14.811 15.7498 14.811C16.1972 14.811 16.6263 14.9887 16.9427 15.3051C17.2591 15.6215 17.4368 16.0506 17.4368 16.498C17.4368 16.9454 17.2591 17.3745 16.9427 17.6909C16.6263 18.0073 16.1972 18.185 15.7498 18.185"
                fill="currentColor"
              />
            </svg>
          </span>
          <span>CUSTOMISE</span>
        </button>
      </header>

      <main class="app-layout">
        <section class="preview-area" aria-label="Clock preview area">
          <div class="preview-stage">
            <div class="clock-frame">
              <div class="clock-face" aria-label="Analog clock face preview">
                <div class="clock-face__surface"></div>
                <div class="clock-markers" aria-hidden="true"></div>
                <div class="clock-numbers" aria-hidden="true"></div>

                <div class="clock-hands" aria-hidden="true">
                  <div class="clock-hand clock-hand--hour">
                    <div class="clock-hand__lume clock-hand__lume--hour"></div>
                  </div>
                  <div class="clock-hand clock-hand--minute">
                    <div class="clock-hand__lume clock-hand__lume--minute"></div>
                  </div>
                  <div class="clock-hand clock-hand--second"></div>
                </div>

                <div class="clock-center" aria-hidden="true">
                  <span class="clock-center__cap"></span>
                  <span class="clock-center__pin"></span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section
          class="style-library"
          id="style-library"
          aria-label="Style library"
          aria-hidden="true"
        >
          <div class="style-library__tray">
            <button class="style-library__arrow" id="style-library-prev" type="button" aria-label="Previous styles">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"><path fill="#000" d="M13.163 15.587a.94.94 0 1 1-1.328 1.328l-6.25-6.25a.94.94 0 0 1 0-1.328l6.25-6.25a.94.94 0 1 1 1.328 1.328L7.578 10z"/></svg>
            </button>
            <div class="style-library__slots" id="style-library-slots" role="list" aria-label="Style options"></div>
            <button class="style-library__arrow" id="style-library-next" type="button" aria-label="Next styles">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"><path fill="#000" d="m14.413 10.663-6.25 6.25a.939.939 0 1 1-1.328-1.328L12.422 10 6.837 4.413a.94.94 0 0 1 1.328-1.328l6.25 6.25a.94.94 0 0 1-.002 1.328"/></svg>
            </button>
          </div>
          <button
            class="style-library__toggle"
            id="style-library-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="style-library"
          >
            <span data-style-library-label>STYLE LIBRARY</span>
          </button>
        </section>

        <aside class="control-panel" id="control-panel" aria-label="Customisation panel" aria-hidden="true">
          <nav class="panel-tabs" aria-label="Customisation sections">
            <button class="panel-tab panel-tab--active" data-tab="hands" type="button">Hands</button>
            <button class="panel-tab" data-tab="indices" type="button">Indices</button>
            <button class="panel-tab" data-tab="numbers" type="button">Numbers</button>
            <button class="panel-tab" data-tab="base" type="button">Base</button>
          </nav>

          <section class="tab-panel tab-panel--active" data-panel="hands" aria-label="Hands settings">
            <article class="accordion-section accordion-section--open">
              <button class="accordion-toggle" data-accordion-toggle type="button" aria-expanded="true">
                <span>Hour hand</span>
                <span class="accordion-toggle__icon" aria-hidden="true">
                  <img class="accordion-toggle__icon-image" src="assets/CaretDown.svg" alt="" />
                </span>
              </button>
              <div class="accordion-content">
                <div class="control-row">
                  <label class="control-label" for="hour-visible">Visibility</label>
                  <label class="switch" for="hour-visible">
                    <input id="hour-visible" data-hand="hour" data-control="visible" type="checkbox" checked />
                    <span class="switch__track" aria-hidden="true"></span>
                  </label>
                </div>
                <div class="control-row">
                  <label class="control-label" for="hour-color">Colour</label>
                  <input
                    id="hour-color"
                    class="color-input"
                    data-hand="hour"
                    data-control="color"
                    type="color"
                    value="#1f1f1f"
                  />
                </div>
                <div class="control-row">
                  <label class="control-label" for="hour-length">Length</label>
                  <div class="range-control">
                    <input
                      id="hour-length"
                      class="range-input"
                      data-hand="hour"
                      data-control="length"
                      type="range"
                      min="0.25"
                      max="0.55"
                      step="0.01"
                      value="0.45"
                    />
                    <output class="control-value" data-output="hour-length" for="hour-length">0.45</output>
                  </div>
                </div>
                <div class="control-row">
                  <label class="control-label" for="hour-lume-visible">Show lume</label>
                  <label class="switch" for="hour-lume-visible">
                    <input id="hour-lume-visible" data-hand="hour" data-control="lumeVisible" type="checkbox" />
                    <span class="switch__track" aria-hidden="true"></span>
                  </label>
                </div>
                <div class="control-row">
                  <label class="control-label" for="hour-lume-color">Lume colour</label>
                  <input
                    id="hour-lume-color"
                    class="color-input"
                    data-hand="hour"
                    data-control="lumeColor"
                    type="color"
                    value="#f5f5f5"
                  />
                </div>
                <div class="control-row">
                  <span class="control-label">Shape</span>
                  <div class="segmented-control" role="radiogroup" aria-label="Hour hand shape">
                    <label class="segmented-control__option">
                      <input data-hand="hour" data-control="shape" name="hour-shape" type="radio" value="rounded" checked />
                      <span>Rounded</span>
                    </label>
                    <label class="segmented-control__option">
                      <input data-hand="hour" data-control="shape" name="hour-shape" type="radio" value="pointed" />
                      <span>Pointed</span>
                    </label>
                  </div>
                </div>
              </div>
            </article>

            <article class="accordion-section accordion-section--open">
              <button class="accordion-toggle" data-accordion-toggle type="button" aria-expanded="true">
                <span>Minute hand</span>
                <span class="accordion-toggle__icon" aria-hidden="true">
                  <img class="accordion-toggle__icon-image" src="assets/CaretDown.svg" alt="" />
                </span>
              </button>
              <div class="accordion-content">
                <div class="control-row">
                  <label class="control-label" for="minute-visible">Visibility</label>
                  <label class="switch" for="minute-visible">
                    <input
                      id="minute-visible"
                      data-hand="minute"
                      data-control="visible"
                      type="checkbox"
                      checked
                    />
                    <span class="switch__track" aria-hidden="true"></span>
                  </label>
                </div>
                <div class="control-row">
                  <label class="control-label" for="minute-color">Colour</label>
                  <input
                    id="minute-color"
                    class="color-input"
                    data-hand="minute"
                    data-control="color"
                    type="color"
                    value="#2c2c2c"
                  />
                </div>
                <div class="control-row">
                  <label class="control-label" for="minute-length">Length</label>
                  <div class="range-control">
                    <input
                      id="minute-length"
                      class="range-input"
                      data-hand="minute"
                      data-control="length"
                      type="range"
                      min="0.35"
                      max="0.75"
                      step="0.01"
                      value="0.65"
                    />
                    <output class="control-value" data-output="minute-length" for="minute-length">0.65</output>
                  </div>
                </div>
                <div class="control-row">
                  <label class="control-label" for="minute-lume-visible">Show lume</label>
                  <label class="switch" for="minute-lume-visible">
                    <input
                      id="minute-lume-visible"
                      data-hand="minute"
                      data-control="lumeVisible"
                      type="checkbox"
                    />
                    <span class="switch__track" aria-hidden="true"></span>
                  </label>
                </div>
                <div class="control-row">
                  <label class="control-label" for="minute-lume-color">Lume colour</label>
                  <input
                    id="minute-lume-color"
                    class="color-input"
                    data-hand="minute"
                    data-control="lumeColor"
                    type="color"
                    value="#f5f5f5"
                  />
                </div>
                <div class="control-row">
                  <span class="control-label">Shape</span>
                  <div class="segmented-control" role="radiogroup" aria-label="Minute hand shape">
                    <label class="segmented-control__option">
                      <input
                        data-hand="minute"
                        data-control="shape"
                        name="minute-shape"
                        type="radio"
                        value="rounded"
                        checked
                      />
                      <span>Rounded</span>
                    </label>
                    <label class="segmented-control__option">
                      <input
                        data-hand="minute"
                        data-control="shape"
                        name="minute-shape"
                        type="radio"
                        value="pointed"
                      />
                      <span>Pointed</span>
                    </label>
                  </div>
                </div>
              </div>
            </article>

            <article class="accordion-section accordion-section--open">
              <button class="accordion-toggle" data-accordion-toggle type="button" aria-expanded="true">
                <span>Second hand</span>
                <span class="accordion-toggle__icon" aria-hidden="true">
                  <img class="accordion-toggle__icon-image" src="assets/CaretDown.svg" alt="" />
                </span>
              </button>
              <div class="accordion-content">
                <div class="control-row">
                  <label class="control-label" for="second-visible">Visibility</label>
                  <label class="switch" for="second-visible">
                    <input
                      id="second-visible"
                      data-hand="second"
                      data-control="visible"
                      type="checkbox"
                      checked
                    />
                    <span class="switch__track" aria-hidden="true"></span>
                  </label>
                </div>
                <div class="control-row">
                  <label class="control-label" for="second-color">Colour</label>
                  <input
                    id="second-color"
                    class="color-input"
                    data-hand="second"
                    data-control="color"
                    type="color"
                    value="#d4151e"
                  />
                </div>
                <div class="control-row">
                  <label class="control-label" for="second-length">Length</label>
                  <div class="range-control">
                    <input
                      id="second-length"
                      class="range-input"
                      data-hand="second"
                      data-control="length"
                      type="range"
                      min="0.35"
                      max="0.8"
                      step="0.01"
                      value="0.7"
                    />
                    <output class="control-value" data-output="second-length" for="second-length">0.70</output>
                  </div>
                </div>
              </div>
            </article>
          </section>

          <section class="tab-panel" data-panel="indices" aria-label="Indices settings" hidden>
            <article class="accordion-section accordion-section--open">
              <button class="accordion-toggle" type="button" aria-expanded="true">
                <span>Hour markers</span>
                <span class="accordion-toggle__icon" aria-hidden="true">
                  <img class="accordion-toggle__icon-image" src="assets/CaretDown.svg" alt="" />
                </span>
              </button>
              <div class="accordion-content">
                <div class="control-row">
                  <label class="control-label" for="hour-markers-visible">Visibility</label>
                  <label class="switch" for="hour-markers-visible">
                    <input
                      id="hour-markers-visible"
                      data-section="hourMarkers"
                      data-control="visible"
                      type="checkbox"
                      checked
                    />
                    <span class="switch__track" aria-hidden="true"></span>
                  </label>
                </div>
                <div class="control-row">
                  <label class="control-label" for="hour-markers-color">Colour</label>
                  <input
                    id="hour-markers-color"
                    class="color-input"
                    data-section="hourMarkers"
                    data-control="color"
                    type="color"
                    value="#2d2d2d"
                  />
                </div>
                <div class="control-row">
                  <label class="control-label" for="hour-markers-cardinal">Cardinal position</label>
                  <label class="switch" for="hour-markers-cardinal">
                    <input
                      id="hour-markers-cardinal"
                      data-section="hourMarkers"
                      data-control="cardinalOnly"
                      type="checkbox"
                    />
                    <span class="switch__track" aria-hidden="true"></span>
                  </label>
                </div>
                <div class="control-row">
                  <label class="control-label" for="hour-markers-dot">Display as dot</label>
                  <label class="switch" for="hour-markers-dot">
                    <input
                      id="hour-markers-dot"
                      data-section="hourMarkers"
                      data-control="displayAsDot"
                      type="checkbox"
                    />
                    <span class="switch__track" aria-hidden="true"></span>
                  </label>
                </div>
              </div>
            </article>

            <article class="accordion-section accordion-section--open">
              <button class="accordion-toggle" type="button" aria-expanded="true">
                <span>Minute markers</span>
                <span class="accordion-toggle__icon" aria-hidden="true">
                  <img class="accordion-toggle__icon-image" src="assets/CaretDown.svg" alt="" />
                </span>
              </button>
              <div class="accordion-content">
                <div class="control-row">
                  <label class="control-label" for="minute-markers-visible">Visibility</label>
                  <label class="switch" for="minute-markers-visible">
                    <input
                      id="minute-markers-visible"
                      data-section="minuteMarkers"
                      data-control="visible"
                      type="checkbox"
                      checked
                    />
                    <span class="switch__track" aria-hidden="true"></span>
                  </label>
                </div>
                <div class="control-row">
                  <label class="control-label" for="minute-markers-color">Colour</label>
                  <input
                    id="minute-markers-color"
                    class="color-input"
                    data-section="minuteMarkers"
                    data-control="color"
                    type="color"
                    value="#2d2d2d"
                  />
                </div>
                <div class="control-row">
                  <label class="control-label" for="minute-markers-dot">Display as dot</label>
                  <label class="switch" for="minute-markers-dot">
                    <input
                      id="minute-markers-dot"
                      data-section="minuteMarkers"
                      data-control="displayAsDot"
                      type="checkbox"
                    />
                    <span class="switch__track" aria-hidden="true"></span>
                  </label>
                </div>
              </div>
            </article>
          </section>

          <section class="tab-panel" data-panel="numbers" aria-label="Numbers settings" hidden>
            <article class="accordion-section accordion-section--open">
              <button class="accordion-toggle" type="button" aria-expanded="true">
                <span>Numbers</span>
                <span class="accordion-toggle__icon" aria-hidden="true">
                  <img class="accordion-toggle__icon-image" src="assets/CaretDown.svg" alt="" />
                </span>
              </button>
              <div class="accordion-content">
                <div class="control-row">
                  <label class="control-label" for="numbers-visible">Visibility</label>
                  <label class="switch" for="numbers-visible">
                    <input id="numbers-visible" data-section="numbers" data-control="visible" type="checkbox" checked />
                    <span class="switch__track" aria-hidden="true"></span>
                  </label>
                </div>
                <div class="control-row">
                  <label class="control-label" for="numbers-color">Colour</label>
                  <input
                    id="numbers-color"
                    class="color-input"
                    data-section="numbers"
                    data-control="color"
                    type="color"
                    value="#202020"
                  />
                </div>
                <div class="control-row">
                  <label class="control-label" for="numbers-font">Font</label>
                  <select id="numbers-font" class="font-select" data-section="numbers" data-control="fontFamily">
                    <option value="Inter, sans-serif">Inter</option>
                    <option value="Poppins, sans-serif">Poppins</option>
                    <option value="Montserrat, sans-serif">Montserrat</option>
                    <option value='"Space Grotesk", sans-serif'>Space Grotesk</option>
                    <option value='"DM Sans", sans-serif'>DM Sans</option>
                    <option value='"Playfair Display", serif'>Playfair Display</option>
                    <option value='"Cormorant Garamond", serif'>Cormorant Garamond</option>
                    <option value='"Libre Baskerville", serif'>Libre Baskerville</option>
                    <option value='"Helvetica Neue", Helvetica, Arial, sans-serif'>Helvetica</option>
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="Georgia, serif">Georgia</option>
                    <option value='"Times New Roman", serif'>Times New Roman</option>
                    <option value='"JetBrains Mono", monospace'>JetBrains Mono</option>
                    <option value='"IBM Plex Mono", monospace'>IBM Plex Mono</option>
                    <option value="Orbitron, sans-serif">Orbitron</option>
                    <option value='"Exo 2", sans-serif'>Exo 2</option>
                    <option value="Rajdhani, sans-serif">Rajdhani</option>
                    <option value='"Bebas Neue", sans-serif'>Bebas Neue</option>
                    <option value="Oswald, sans-serif">Oswald</option>
                    <option value='"Courier New", monospace'>Courier New</option>
                  </select>
                </div>
                <div class="control-row">
                  <label class="control-label" for="numbers-size">Size</label>
                  <div class="range-control">
                    <input
                      id="numbers-size"
                      class="range-input"
                      data-section="numbers"
                      data-control="fontSize"
                      type="range"
                      min="16"
                      max="48"
                      step="1"
                      value="24"
                    />
                    <output class="control-value" data-output="numbers-fontSize" for="numbers-size">24</output>
                  </div>
                </div>
                <div class="control-row">
                  <label class="control-label" for="numbers-weight">Weight</label>
                  <div class="range-control">
                    <input
                      id="numbers-weight"
                      class="range-input"
                      data-section="numbers"
                      data-control="fontWeight"
                      type="range"
                      min="100"
                      max="900"
                      step="100"
                      value="400"
                    />
                    <output class="control-value" data-output="numbers-fontWeight" for="numbers-weight">400</output>
                  </div>
                </div>
                <div class="control-row">
                  <label class="control-label" for="numbers-cardinal">Cardinal position</label>
                  <label class="switch" for="numbers-cardinal">
                    <input id="numbers-cardinal" data-section="numbers" data-control="cardinalOnly" type="checkbox" />
                    <span class="switch__track" aria-hidden="true"></span>
                  </label>
                </div>
              </div>
            </article>
          </section>

          <section class="tab-panel" data-panel="base" aria-label="Base settings" hidden>
            <article class="accordion-section accordion-section--open">
              <button class="accordion-toggle" type="button" aria-expanded="true">
                <span>Base</span>
                <span class="accordion-toggle__icon" aria-hidden="true">
                  <img class="accordion-toggle__icon-image" src="assets/CaretDown.svg" alt="" />
                </span>
              </button>
              <div class="accordion-content">
                <div class="control-row">
                  <label class="control-label" for="base-clock-face-color">Clock face</label>
                  <input
                    id="base-clock-face-color"
                    class="color-input"
                    data-section="base"
                    data-control="clockFaceBackgroundColor"
                    type="color"
                    value="#ececec"
                  />
                </div>
                <div class="control-row">
                  <label class="control-label" for="base-clock-face-alpha">Clock face alpha</label>
                  <div class="range-control">
                    <input
                      id="base-clock-face-alpha"
                      class="range-input"
                      data-section="base"
                      data-control="clockFaceBackgroundAlpha"
                      type="range"
                      min="0"
                      max="1"
                      step="0.05"
                      value="1"
                    />
                    <output class="control-value" data-output="base-clockFaceBackgroundAlpha" for="base-clock-face-alpha">
                      1.00
                    </output>
                  </div>
                </div>
                <div class="control-row">
                  <label class="control-label" for="base-page-color">Page background</label>
                  <input
                    id="base-page-color"
                    class="color-input"
                    data-section="base"
                    data-control="pageBackgroundColor"
                    type="color"
                    value="#e8e9e9"
                  />
                </div>
                <div class="control-row">
                  <label class="control-label" for="base-pattern">Pattern</label>
                  <select id="base-pattern" class="font-select" data-section="base" data-control="pageBackgroundPattern">
                    <option value="">None</option>
                    <option value="assets/patterns/cubes.png">Cubes</option>
                    <option value="assets/patterns/decalees.png">Decalees</option>
                    <option value="assets/patterns/diamond.png">Diamond</option>
                    <option value="assets/patterns/diamond-2.png">Diamond 2</option>
                    <option value="assets/patterns/embossed.png">Embossed</option>
                    <option value="assets/patterns/leather.png">Leather</option>
                    <option value="assets/patterns/leather-2.png">Leather 2</option>
                    <option value="assets/patterns/metal.png">Metal</option>
                    <option value="assets/patterns/metal-2.png">Metal 2</option>
                    <option value="assets/patterns/noise.png">Noise</option>
                    <option value="assets/patterns/pixel.png">Pixel</option>
                    <option value="assets/patterns/pyramid.png">Pyramid</option>
                    <option value="assets/patterns/skulls.png">Skulls</option>
                  </select>
                </div>
              </div>
            </article>
          </section>
        </aside>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
